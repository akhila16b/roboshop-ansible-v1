- name: configure rabbitmq server
  hosts: rabbitmq
  become: yes
  tasks:
  - name: copy rabbitmq repo
    copy:
      src: rabbitmq.repo
      path: /etc/yum.repos.d/rabbitmq.repo

  - name: install rabbitmq server
    dnf:
      name: 
      - erlang
      - rabbitmq-server
      state: present
  
  - name: enable and start rabbitmq
    service:
      name: rabbitmq-server
      state: started
      enabled: yes
  
  - name: create user
    community.rabbitmq.rabbitmq_user:
      user: roboshop
      password: roboshop123
      vhost: /
      configure_priv: .*
      read_priv: .*
      write_priv: .*
      state: present
      